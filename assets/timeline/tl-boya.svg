<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#08110c"/>
      <stop offset=".6" stop-color="#102017"/>
      <stop offset="1" stop-color="#1b3124"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d3327"/>
      <stop offset="1" stop-color="#060c09"/>
    </linearGradient>
    <linearGradient id="hull" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0f5df"/>
      <stop offset=".4" stop-color="#ceddaf"/>
      <stop offset="1" stop-color="#5d7662"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#75917a"/>
      <stop offset=".5" stop-color="#2d4335"/>
      <stop offset="1" stop-color="#16251b"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#e0eacb" stop-opacity=".5"/>
      <stop offset=".35" stop-color="#ceddaf" stop-opacity=".16"/>
      <stop offset="1" stop-color="#ceddaf" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx=".5" cy=".45" r=".8">
      <stop offset=".48" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".58"/>
    </radialGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".78" numOctaves="3" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".075"/></feComponentTransfer>
    </filter>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0v80" fill="none" stroke="#ceddaf" stroke-opacity=".05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="1200" fill="url(#sky)"/>
