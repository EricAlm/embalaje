<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta name="robots" content="noindex"/>
  <meta name="theme-color" content="#E9E6DE"/>
  <title>Página no encontrada · EMBALAJE</title>
  <link rel="stylesheet" href="assets/fonts/fonts.css?v=2"/>
  <style>
    :root {
      --paper: #e9e6de;
      --ink: #171915;
      --ink-soft: #555a52;
      --rule: #17191533;
      --signal: #e8501f;
      --display: 'Barlow Condensed', sans-serif;
      --body: 'Barlow', sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100svh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      padding: 28px max(24px, 5vw) 24px;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--body);
    }
    .top, .bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      font-size: 12px;
      color: var(--ink-soft);
    }
    .top { padding-bottom: 16px; border-bottom: 1px solid var(--rule); }
    .bottom { padding-top: 16px; border-top: 1px solid var(--rule); }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--ink);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: .13em;
    }
    .bars { display: flex; align-items: center; gap: 3px; height: 20px; transform: skewY(-24deg); }
    .bars i { display: block; width: 3px; height: 13px; background: var(--signal); }
    .bars i:nth-child(2) { height: 20px; }
    main {
      display: grid;
      grid-template-columns: 1fr 1fr;
      align-items: end;
      gap: 6vw;
      padding: 8vh 0;
    }
    .code {
      color: var(--signal);
      font-family: var(--display);
      font-size: clamp(120px, 24vw, 320px);
      font-weight: 600;
      line-height: .72;
      letter-spacing: -.02em;
    }
    h1 {
      max-width: 12ch;
      margin: 0 0 20px;
      font-family: var(--display);
      font-size: clamp(44px, 6vw, 82px);
      font-weight: 600;
      line-height: .9;
      letter-spacing: -.01em;
    }
    p { max-width: 42ch; margin: 0; color: var(--ink-soft); line-height: 1.6; }
    a.cta {
      display: inline-block;
      margin-top: 28px;
      padding: 15px 20px;
      background: #c43e12;
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
    }
    a.cta:hover { background: #9e350e; }
    a:focus-visible { outline: 2px solid var(--ink); outline-offset: 4px; }
    @media (max-width: 760px) {
      main { grid-template-columns: 1fr; align-items: start; gap: 32px; padding: 10vh 0; }
      .code { font-size: clamp(120px, 40vw, 200px); }
    }
  </style>
</head>
<body>
  <header class="top">
    <span class="brand"><span class="bars" aria-hidden="true"><i></i><i></i><i></i></span>EMBALAJE</span>
    <span>Error 404</span>
  </header>
  <main>
    <div class="code" aria-hidden="true">404</div>
    <div>
      <h1>No encontramos esta página.</h1>
      <p>El enlace cambió o la dirección no existe. Volvé al inicio para conocer el sistema y recorrer la línea en 3D.</p>
      <a class="cta" href="index.html">Volver a EMBALAJE</a>
    </div>
  </main>
  <footer class="bottom">
    <span>Automatización y trazabilidad</span>
    <span>2026</span>
  </footer>
</body>
</html>
